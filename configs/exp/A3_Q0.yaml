# A3 decoding sweep (docs/notes/09-inference-configs/research_report.md); retrieval = A2e.
note: "A3 Q0: Qwen3.5-2B thinking off, official"
sources: [corpus, vbpl_cited, web]
chunk: {kind: dieu, size: 2000, overlap: 100, clean: true, dedup: true}
embed: {model: AITeamVN/Vietnamese_Embedding, normalize: true, max_len: 512}
retrieve: {kind: dense, metric: ip, k: 5, candidates: 50}
rerank: {model: AITeamVN/Vietnamese_Reranker, max_len: 1024}
generate:
  model: Qwen/Qwen3.5-2B
  params_b: 2.27
  prompt: vi_rag
  max_tokens: 1024
  thinking: false
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  min_p: 0.0
  presence_penalty: 2.0
