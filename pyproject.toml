[project]
name = "law-rag"
version = "0.1.0"
description = "Vietnamese law QA with retrieval-augmented generation (course assignment)"
requires-python = ">=3.11"
dependencies = ["numpy", "polars", "pyyaml", "tqdm"]

[project.optional-dependencies]
rag = ["sentence-transformers", "faiss-cpu", "rank-bm25", "pyvi", "networkx", "transformers", "accelerate"]
gpu = ["vllm", "peft", "trl", "bitsandbytes"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
