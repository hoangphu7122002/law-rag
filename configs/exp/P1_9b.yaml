# Teacher data pass 1: Qwen3.5-9B answers from the retrieval profile + pipeline top-5, NO tools (docs/research/teacher-data-plan.md). Split is set per run.
note: "P1 9B pass 1: profile + top-5, no tools"
sources: [corpus, vbpl_cited, web]
chunk: {kind: dieu, size: 2000, overlap: 100, clean: true, dedup: true}
embed: {model: AITeamVN/Vietnamese_Embedding, normalize: true, max_len: 512}
retrieve: {kind: dense, metric: ip, k: 5, candidates: 50}
rerank: {model: AITeamVN/Vietnamese_Reranker, max_len: 1024}
generate:
  model: Qwen/Qwen3.5-9B
  params_b: 9
  teacher: true   # a 9B is allowed only as a data teacher, never as the answering model
  prompt: vi_rag
  max_tokens: 1024
  thinking: false
  temperature: 0.0
  shots: 2
  agent: true
  agent_tools: []
  agent_profile: true
  max_turns: 1
  agent_initial_k: -1
  concurrency: 8
