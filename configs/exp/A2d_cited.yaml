# A2d_cited (M2): A2c with the test-informed corpus: course + vbpl_cited (central >= 2000 + every cited vbpl doc)
# + web (luatvietnam.vn crawl of cited docs missing elsewhere). Report as test-informed (docs/CHANGELOG.md Step 16-17).
note: "M2: course + vbpl_cited + web, cleaned, one node per Điều"
sources: [corpus, vbpl_cited, web]
chunk: {kind: dieu, size: 2000, overlap: 100, clean: true}
embed: {model: AITeamVN/Vietnamese_Embedding, normalize: true, max_len: 512}
retrieve: {kind: dense, metric: ip, k: 5, candidates: 50}
rerank: {model: AITeamVN/Vietnamese_Reranker, max_len: 1024}
generate:
  model: AITeamVN/Vi-Qwen2-3B-RAG
  params_b: 3.09
  mode: chat
  prompt: vi_rag
  max_tokens: 768
  temperature: 0.0
