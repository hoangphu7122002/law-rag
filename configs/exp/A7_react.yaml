# A7 ReAct baseline on the RAW Qwen3.5-2B (no SFT), native tool calls, datamate recipe; retrieval = A2e. Dev split is set per run.
note: "A7 ReAct raw Qwen3.5-2B: search_law + get_article, initial 5 passages"
sources: [corpus, vbpl_cited, web]
chunk: {kind: dieu, size: 2000, overlap: 100, clean: true, dedup: true}
embed: {model: AITeamVN/Vietnamese_Embedding, normalize: true, max_len: 512}
retrieve: {kind: dense, metric: ip, k: 5, candidates: 50}
rerank: {model: AITeamVN/Vietnamese_Reranker, max_len: 1024}
generate:
  model: Qwen/Qwen3.5-2B
  params_b: 2.27
  prompt: vi_rag
  max_tokens: 1024
  thinking: false
  temperature: 0.0
  agent: true
  max_turns: 4
  agent_initial_k: -1
  concurrency: 8
